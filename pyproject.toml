# mxi_stills, the stills indexer as a Python module for dials.stills_process.
# The C++ programs build with CMake alone and need none of this; mxeq, the
# referee, is a separate package under python/.
#
#   pip install .
#
# builds only the module, in build-py/, which is kept between installs so that
# a rebuild is incremental.

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "mxi-stills"
version = "0.1.0"
description = "mxi stills indexing, for dials.stills_process"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define.MXI_PYTHON = "ON"
build.targets = ["_mxi_stills"]
install.components = ["python"]
build-dir = "build-py/{wheel_tag}"
wheel.packages = ["bindings/mxi_stills"]

[tool.pytest.ini_options]
testpaths = ["bindings/tests"]
